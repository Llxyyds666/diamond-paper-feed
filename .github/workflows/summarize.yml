name: Summarize diamond literature

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      smoke_test:
        description: Send one minimal DeepSeek request without publishing a digest
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: diamond-paper-feed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install project and test dependencies
        run: python -m pip install ".[dev]"

      - name: Test before summarization
        run: python -m pytest -q

      - name: Run one-request DeepSeek smoke test
        if: ${{ inputs.smoke_test == true }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from diamond_feed.ai import DeepSeekClient, RequestBudget, screen_batch
          from diamond_feed.config import load_config
          from diamond_feed.state import load_state

          config = load_config(Path("paper_feed_config.json"))
          state = load_state(Path("state.json"))
          if not state.pending_ai:
              raise SystemExit("No pending paper is available for the DeepSeek smoke test")
          key = min(
              state.pending_ai,
              key=lambda pending_key: state.papers[pending_key].published_at,
          )
          client = DeepSeekClient(os.environ["DEEPSEEK_API_KEY"], config.ai)
          budget = RequestBudget(1)
          decisions = screen_batch([state.papers[key]], client, config.ai, budget)
          if len(decisions) != 1 or decisions[0].key != key:
              raise SystemExit("DeepSeek smoke response did not match the requested paper")
          if not client.token_usage_complete:
              raise SystemExit("DeepSeek smoke response did not include complete token usage")
          print(
              f"smoke=ok requests={budget.used} "
              f"relevant={decisions[0].relevant} category={decisions[0].category} "
              f"prompt_tokens={client.prompt_tokens} "
              f"completion_tokens={client.completion_tokens}"
          )
          PY

      - name: Generate bounded DeepSeek digest
        id: summarize
        if: ${{ inputs.smoke_test != true }}
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          BARK_ENABLED: ${{ secrets.BARK_TOKEN != '' }}
        run: >-
          python -m diamond_feed.summarize
          --config paper_feed_config.json
          --state state.json
          --notification-plan "${{ runner.temp }}/diamond-notification.json"

      - name: Commit and push summary outputs
        id: publish
        if: ${{ always() && (steps.summarize.outcome == 'success' || steps.summarize.outcome == 'failure') }}
        shell: bash
        run: |
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          allowed_outputs=(
            "ai_summary_feed.xml"
            "ai_summary.html"
            "device_focus_feed.xml"
            "ai_usage.json"
            "state.json"
          )
          existing_outputs=()
          for output in "${allowed_outputs[@]}"; do
            if [[ -e "${output}" ]] || git ls-files --error-unmatch -- "${output}" > /dev/null 2>&1; then
              existing_outputs+=("${output}")
            fi
          done
          if (( ${#existing_outputs[@]} > 0 )); then
            git add -- "${existing_outputs[@]}"
          fi
          if git diff --cached --quiet; then
            echo "No summary output changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update DeepSeek diamond digest"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Send Bark notifications
        if: ${{ inputs.smoke_test != true && steps.summarize.outcome == 'success' && steps.publish.outputs.pushed == 'true' }}
        continue-on-error: true
        env:
          BARK_TOKEN: ${{ secrets.BARK_TOKEN }}
        run: >-
          python -m diamond_feed.notify
          --plan "${{ runner.temp }}/diamond-notification.json"

      - name: Propagate summary failure
        if: ${{ always() && steps.summarize.outcome == 'failure' }}
        run: exit 1
