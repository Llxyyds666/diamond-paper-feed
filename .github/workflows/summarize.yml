name: Summarize diamond literature

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      smoke_test:
        description: Send one minimal DeepSeek request without publishing a digest
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: diamond-paper-feed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install project and test dependencies
        run: python -m pip install ".[dev]"

      - name: Test before summarization
        run: python -m pytest -q

      - name: Run one-request DeepSeek smoke test
        if: ${{ inputs.smoke_test == true }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import os

          from diamond_feed.ai import DeepSeekClient, RequestBudget
          from diamond_feed.config import load_config

          config = load_config("paper_feed_config.json")
          client = DeepSeekClient(os.environ["DEEPSEEK_API_KEY"], config.ai)
          budget = RequestBudget(1)
          result = client.complete_json(
              messages=[
                  {
                      "role": "system",
                      "content": "Return only one JSON object with exactly an ok field set to true.",
                  },
                  {"role": "user", "content": "Connection check."},
              ],
              max_tokens=32,
              budget=budget,
          )
          if result != {"ok": True}:
              raise SystemExit("DeepSeek smoke response did not match the required JSON")
          if not client.token_usage_complete:
              raise SystemExit("DeepSeek smoke response did not include complete token usage")
          print(
              f"smoke=ok requests={budget.used} "
              f"prompt_tokens={client.prompt_tokens} "
              f"completion_tokens={client.completion_tokens}"
          )
          PY

      - name: Generate bounded DeepSeek digest
        id: summarize
        if: ${{ inputs.smoke_test != true }}
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m diamond_feed.summarize --config paper_feed_config.json --state state.json

      - name: Commit and push summary outputs
        if: ${{ always() && (steps.summarize.outcome == 'success' || steps.summarize.outcome == 'failure') }}
        shell: bash
        run: |
          allowed_outputs=(
            "ai_summary_feed.xml"
            "ai_summary.html"
            "ai_usage.json"
            "state.json"
          )
          existing_outputs=()
          for output in "${allowed_outputs[@]}"; do
            if [[ -e "${output}" ]] || git ls-files --error-unmatch -- "${output}" > /dev/null 2>&1; then
              existing_outputs+=("${output}")
            fi
          done
          if (( ${#existing_outputs[@]} > 0 )); then
            git add -- "${existing_outputs[@]}"
          fi
          if git diff --cached --quiet; then
            echo "No summary output changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update DeepSeek diamond digest"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Propagate summary failure
        if: ${{ always() && steps.summarize.outcome == 'failure' }}
        run: exit 1
